<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#B4FF39" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#B4FF39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B9BEC6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0B0D"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="80" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#F5F6F7">LivingAll24<tspan fill="#B4FF39">.</tspan></text>

  <!-- headline -->
  <text x="80" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="88" font-weight="800" fill="url(#ink)">Level up your</text>
  <text x="80" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="88" font-weight="800" fill="#F5F6F7"><tspan fill="#B4FF39">actual</tspan> life.</text>

  <!-- subcopy -->
  <text x="82" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="#8A8F98">Build your OVR. Earn XP. Compete with friends.</text>

  <!-- OVR chip -->
  <g transform="translate(880,150)">
    <rect x="0" y="0" width="240" height="330" rx="28" fill="#141619" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="28" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="3" fill="#8A8F98">OVERALL</text>
    <text x="24" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="140" font-weight="800" fill="#6EE7A8">81</text>
    <g transform="translate(28,210)">
      <rect x="0" y="0" width="184" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="0" y="0" width="150" height="8" rx="4" fill="#B4FF39"/>
      <rect x="0" y="30" width="184" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="0" y="30" width="120" height="8" rx="4" fill="#6EE7A8"/>
      <rect x="0" y="60" width="184" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="0" y="60" width="135" height="8" rx="4" fill="#6EE7A8"/>
    </g>
  </g>

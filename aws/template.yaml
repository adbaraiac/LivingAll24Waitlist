AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Waitlist backend for the LivingAll24 landing page.
  API Gateway (HTTP API) -> Lambda -> DynamoDB, with an SNS email notification
  on every signup.

Parameters:
  NotifyEmail:
    Type: String
    Description: >
      Email address that receives a notification on each signup. AWS sends a
      "Subscription Confirmation" email to it on first deploy; click the link.
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: >
      The site origin allowed to call the API (CORS), e.g.
      https://<user>.github.io . Use "*" only while testing.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs24.x

Resources:
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-signups"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # Signup alerts. SNS email comes from AWS's own authenticated domain, so it
  # lands in the inbox (SES from a gmail.com sender gets spam-filtered).
  NotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Waitlist

  NotifySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotifyTopic
      Protocol: email
      Endpoint: !Ref NotifyEmail

  WaitlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: lambda/
      Environment:
        Variables:
          TABLE_NAME: !Ref WaitlistTable
          NOTIFY_TOPIC_ARN: !Ref NotifyTopic
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref WaitlistTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotifyTopic.TopicName
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref WaitlistApi
            Path: /waitlist
            Method: POST

  WaitlistApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

Outputs:
  WaitlistEndpoint:
    Description: >
      Set this as NEXT_PUBLIC_WAITLIST_ENDPOINT in the site's build config.
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com/waitlist"
  TableName:
    Description: DynamoDB table holding signups.
    Value: !Ref WaitlistTable
